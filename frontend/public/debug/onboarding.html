<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norma 首启向导</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="brand-title">NORMA / FIRST RUN</div>
          <span class="brand-sub">设备、模型、Provider 与权限引导</span>
        </div>
      </div>
      <nav class="nav-tabs">
        <a href="./index.html">运行时诊断</a>
        <a href="./memory.html">记忆管理</a>
        <a href="./metrics.html">指标看板</a>
        <a href="./settings.html">运行时设置</a>
        <a class="active" href="./onboarding.html">首启向导</a>
      </nav>
      <span class="status-chip">首启检查</span>
    </header>

    <section class="hero">
      <span class="hero-tag">First Run Wizard</span>
      <h1>首启向导</h1>
      <p>聚合 Provider 就绪、Live2D 模型、配置文件、设备矩阵与回退模式建议。适合首次安装、迁移环境和升级后回归检查。</p>
      <div class="hero-actions">
        <button id="refresh" class="primary">重新检测</button>
        <a class="button-link" href="./settings.html">前往设置页</a>
      </div>
    </section>

    <section class="layout layout-2">
      <section class="panel">
        <div class="panel-head">
          <h2>检查结果</h2>
          <span class="mini-note">Wizard Report</span>
        </div>
        <div class="panel-body stack">
          <div id="summary" class="stat-list"></div>
          <div id="checks" class="control-stack"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>建议与回退</h2>
          <span class="mini-note">Fallback Guide</span>
        </div>
        <div class="panel-body stack">
          <div id="suggestions" class="control-stack"></div>
          <div>
            <div class="mini-note" style="margin-bottom:10px;">兼容回退模式</div>
            <div id="fallback_modes" class="control-stack"></div>
          </div>
          <pre id="log" class="console"></pre>
        </div>
      </section>
    </section>
  </div>
  <script type="module" src="./onboarding.js"></script>
</body>
</html>
