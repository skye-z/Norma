<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norma 记忆管理页</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <div>
          <div class="brand-title">NORMA / MEMORY CONSOLE</div>
          <span class="brand-sub">长期记忆治理入口</span>
        </div>
      </div>
      <nav class="nav-tabs">
        <a href="./index.html">运行时诊断</a>
        <a class="active" href="./memory.html">记忆管理</a>
        <a href="./metrics.html">指标看板</a>
        <a href="./settings.html">运行时设置</a>
      </nav>
      <div class="barcode" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </header>

    <section class="hero">
      <span class="hero-tag">Memory Ops</span>
      <h1>记忆管理页</h1>
      <p>遵循设计稿的三栏控制台结构：左侧写入表单，中间主表，右侧治理日志和状态。保留所有管理动作，但外观严格收敛为统一的黑底终端式界面。</p>
      <div class="hero-actions">
        <button id="create" class="primary">新增记忆</button>
        <button id="governance" class="warn">执行治理</button>
        <button id="refresh">刷新列表</button>
      </div>
    </section>

    <section class="layout-3 layout-grid three">
      <aside class="panel">
        <div class="panel-header">
          <h2>写入表单</h2>
          <span class="mini-note">MANUAL INSERT</span>
        </div>
        <div class="panel-content">
          <div class="form-grid">
            <div class="full">
              <label for="content">记忆内容</label>
              <textarea id="content" rows="4" placeholder="例如：用户偏好本地部署，不希望数据离开本机。"></textarea>
            </div>
            <div><label for="kind">条目类型</label><input id="kind" value="fact" /></div>
            <div><label for="importance">重要度</label><input id="importance" type="number" value="5" min="0" max="10" /></div>
            <div><label for="memory_type">记忆分类</label><input id="memory_type" value="fact" /></div>
            <div><label for="source">来源</label><input id="source" value="manual" /></div>
            <div class="full"><label for="evidence">证据或上下文</label><textarea id="evidence" rows="4" placeholder="记录来源对话、摘要或治理结果。"></textarea></div>
          </div>
        </div>
      </aside>

      <main class="panel">
        <div class="panel-header">
          <h2>记忆总表</h2>
          <span class="mini-note">INCLUDING DISABLED</span>
        </div>
        <div class="panel-content control-stack">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>内容</th>
                  <th>分类</th>
                  <th>重要度</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </main>

      <aside class="panel">
        <div class="panel-header">
          <h2>治理终端</h2>
          <span class="mini-note">AUDIT LOG</span>
        </div>
        <div class="panel-content control-stack">
          <div class="metric-grid">
            <div class="metric-tile"><div class="metric-label">写入模式</div><div class="metric-value" style="font-size:18px;">手动 / 自动</div></div>
            <div class="metric-tile"><div class="metric-label">治理动作</div><div class="metric-value" style="font-size:18px;">去重 / 压缩 / 衰减</div></div>
          </div>
          <div class="mini-note">治理日志</div>
          <pre id="log" class="console"></pre>
        </div>
      </aside>
    </section>
  </div>
  <script type="module" src="./memory.js"></script>
</body>
</html>
