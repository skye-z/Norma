<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norma Console</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="console-frame">
    <header class="console-header">
      <h1>Norma Console</h1>
      <span class="console-version">v1.0.0</span>
    </header>

    <div class="console-layout">
      <aside class="console-sidebar" aria-label="模块开关">
        <section class="console-row" data-module="input">
          <div class="console-row-head">
            <span>输入</span>
            <span id="status-input" class="module-status status-gray" aria-label="输入模块状态"></span>
          </div>
          <p id="text-input">xx模式 Provider</p>
        </section>

        <section class="console-row" data-module="asr">
          <div class="console-row-head">
            <span>识别</span>
            <span id="status-asr" class="module-status status-gray" aria-label="识别模块状态"></span>
          </div>
          <p id="text-asr">Provider</p>
        </section>

        <section class="console-row" data-module="rag">
          <div class="console-row-head">
            <span>检索</span>
            <span id="status-rag" class="module-status status-gray" aria-label="检索模块状态"></span>
          </div>
          <p id="text-rag">RAG Memory</p>
        </section>

        <section class="console-row" data-module="llm">
          <div class="console-row-head">
            <span>对话</span>
            <span id="status-llm" class="module-status status-gray" aria-label="对话模块状态"></span>
          </div>
          <p id="text-llm">LLM Embedding</p>
        </section>

        <section class="console-row" data-module="tts">
          <div class="console-row-head">
            <span>输出</span>
            <span id="status-tts" class="module-status status-gray" aria-label="输出模块状态"></span>
          </div>
          <p id="text-tts">TTS xx声线</p>
        </section>

        <section class="console-row console-row-spacer" aria-hidden="true"></section>

        <section class="console-row" data-module="perf">
          <div class="console-row-head">
            <span>自动降级</span>
            <span id="status-perf" class="module-status status-gray" aria-label="自动降级状态"></span>
          </div>
          <p id="text-perf">xxx策略 xxx阈值</p>
        </section>

        <section class="console-row" data-module="providers">
          <div class="console-row-head single-line">
            <span>模块管理</span>
          </div>
          <p>Provider</p>
          <button id="refresh" type="button">刷新状态</button>
        </section>
      </aside>

      <main class="console-main" aria-label="主体内容区域">
        <div class="console-main-grid">
          <section class="console-card full-width">
            <div class="console-card-head">
              <h2 id="detail-title">模块详情</h2>
              <span id="detail-status" class="state-pill">-</span>
            </div>
            <div class="console-card-body">
              <div id="detail-summary" class="event-detail">-</div>
              <div class="detail-actions">
                <button id="detail-apply" class="primary" type="button">应用改动</button>
                <button id="detail-revert" type="button">撤销改动</button>
                <span id="detail-dirty" class="event-detail">未修改</span>
              </div>
              <div id="detail-config" class="stats"></div>
            </div>
          </section>

          <section class="console-card">
            <div class="console-card-head">
              <h2>运行状态</h2>
              <span id="runtime-state" class="state-pill">未知</span>
            </div>
            <div class="console-card-body stats" id="runtime-stats"></div>
          </section>

          <section class="console-card">
            <div class="console-card-head">
              <h2>模块健康</h2>
            </div>
            <div class="console-card-body" id="health-list"></div>
          </section>

          <section class="console-card full-width">
            <div class="console-card-head">
              <h2>最近事件</h2>
            </div>
            <div class="console-card-body" id="events-list"></div>
          </section>

          <section class="console-card full-width">
            <div class="console-card-head">
              <h2>控制台日志</h2>
            </div>
            <div class="console-card-body">
              <pre id="log" class="console"></pre>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
