name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go test
        shell: bash
        run: |
          export GOCACHE=$(pwd)/.gocache
          export GOMODCACHE=$(pwd)/.gomodcache
          go test ./...