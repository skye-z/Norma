app:
  name: Norma
  env: dev
  log_level: info
  log_dir: resource/logs

database:
  path: resource/data/norma.db

audio:
  enable_wake_word: true
  wake_mode: wake_word_vad
  wake_provider: sherpa-onnx
  wake_binary_path: ""
  wake_model_path: ""
  wake_keywords_file_path: ""
  wake_keyword: 诺玛
  wake_window_ms: 2000
  wake_detect_interval_ms: 400
  endpoint_silence_frames: 20
  interrupt_during_speaking: true
  aec_enabled: false
  ns_enabled: false
  scene: speaker

asr:
  provider: whispercpp
  endpoint: ""
  stream_endpoint: ""
  request_timeout_ms: 10000
  binary_path: ""
  model_path: ""
  language: zh
  threads: 4

llm:
  provider: ollama
  model: ""
  endpoint: http://127.0.0.1:11434
  request_timeout_ms: 45000

tts:
  provider: sherpa-onnx
  voice: zf_xiaobei
  endpoint: ""
  request_timeout_ms: 30000
  binary_path: ""
  model_path: ""
  sentence_first_enabled: true

rag:
  top_k: 6
  vector_index_path: resource/data/vector_index.json
  embed_provider: ollama
  embed_endpoint: http://127.0.0.1:11434
  embed_model: bge-m3:latest

memory:
  stm_token_budget: 2048
  stm_reserve_important: true
  summary_auto_write: true
  governance_compact_hours: 24

