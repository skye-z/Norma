app:
  name: Norma
  env: dev
  log_level: info
  log_dir: resource/logs

database:
  path: resource/data/norma.db

audio:
  enable_wake_word: true
  wake_mode: wake_word_vad
  wake_provider: sherpa-onnx
  wake_binary_path: ""
  wake_model_path: ""
  wake_keywords_file_path: ""
  wake_keyword: 诺玛
  wake_window_ms: 600
  wake_detect_interval_ms: 400
  endpoint_silence_frames: 20
  interrupt_during_speaking: true
  aec_enabled: false
  ns_enabled: false
  scene: speaker

asr:
  provider: whispercpp
  endpoint: ""
  stream_endpoint: ""
  request_timeout_ms: 10000
  binary_path: ""
  model_path: ""
  language: zh
  threads: 4

llm:
  provider: ollama
  model: ""
  endpoint: http://127.0.0.1:11434
  request_timeout_ms: 45000

tts:
  # genie（默认）：GPT-SoVITS 的 ONNX 推理，由应用拉起子进程，经标准输入输出通信，不监听端口。
  # 程序或模型缺失时自动退回系统合成（macOS）或 sherpa-onnx（其他平台）
  provider: genie
  genie:
    worker: resource/runtime/genie/norma-genie-worker
    data_dir: resource/model/genie/GenieData
    character_dir: resource/model/genie/CharacterModels/v2ProPlus/feibi
    language: zh
    # 情绪名（对应 {{smile}} 等动作标记）到参考音频；default 缺省时取角色目录 prompt_wav.json 的第一项
    # references:
    #   smile: { audio: resource/model/genie/refs/smile.wav, text: "参考音频里说的话" }
  voice: zf_xiaobei
  speed: 1.25
  endpoint: ""
  request_timeout_ms: 30000
  binary_path: ""
  model_path: ""
  sentence_first_enabled: true

rag:
  top_k: 6
  vector_index_path: resource/data/vector_index.json
  # provider: hybrid 为全文加向量混合检索；markdown 为整份记忆文件直接作为上下文
  provider: hybrid
  # embed_provider: hash（无语义，回退用）| static（Model2Vec 静态词向量，进程内加载）| ollama
  embed_provider: static
  # static 模型目录，需含 model.safetensors 与 tokenizer.json，缺失时自动回退到 hash
  embed_model_dir: resource/model/model2vec/potion-multilingual-128M

memory:
  # 记忆目录（Markdown，可以直接打开查看和修改，文件是唯一事实来源，索引可随时重建）：
  #   USER.md    用户画像，每轮整体注入提示词，所以上限小
  #   MEMORY.md  长期记忆，按相关度检索
  #   daily/     每日笔记，检索时按 30 天半衰期衰减
  dir: resource/data/memory
  user_char_limit: 1200
  memory_char_limit: 8000
  # 每轮对话结束后，由大模型在后台判断有没有值得记住的内容（需要联网调用对话模型，不想用就改成 false）
  auto_curate: true
  # 旧版单文件记忆，启动时若存在会迁移进上面的目录
  markdown_path: resource/data/memory.md
  markdown_max_bytes: 16384
  stm_token_budget: 2048
  stm_reserve_important: true
  summary_auto_write: true
  governance_compact_hours: 24

