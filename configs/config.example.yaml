app:
  name: Norma
  env: dev
  log_level: info

database:
  path: data/norma.db

audio:
  enable_wake_word: true

asr:
  provider: mock
  endpoint: http://127.0.0.1:8081
  request_timeout_ms: 10000

llm:
  provider: ollama
  endpoint: http://127.0.0.1:11434
  request_timeout_ms: 45000

tts:
  provider: mock
  voice: norma
  endpoint: http://127.0.0.1:8020
  request_timeout_ms: 30000

rag:
  top_k: 6

memory:
  stm_token_budget: 2048

perf:
  auto_degrade: true
  llm_first_token_threshold_ms: 1200
  degraded_rag_top_k: 4
