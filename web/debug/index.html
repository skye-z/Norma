<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norma 运行时诊断</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <main class="wrap">
    <section class="card hero">
      <h1>Norma 运行时诊断面板</h1>
      <p>开发模式下观察状态、事件流、会话与调试入口。</p>
      <div class="row">
        <button id="refresh">刷新诊断</button>
        <button id="bargein">模拟插话打断</button>
        <a href="./settings.html">运行时设置</a>
        <a href="./memory.html">记忆管理</a>
      </div>
    </section>
    <section class="grid">
      <article class="card stats">
        <h2>运行时</h2>
        <div class="metric"><span>状态</span><strong id="state">-</strong></div>
        <div class="metric"><span>最近事件</span><strong id="lastEvent">-</strong></div>
        <div class="metric"><span>队列深度</span><strong id="queueDepth">0</strong></div>
        <div class="metric"><span>会话数</span><strong id="sessionCount">0</strong></div>
      </article>
      <article class="card">
        <h2>快速事件</h2>
        <div class="row"><input id="txt" value="你好，我是诺玛。" /><button id="speak">语音预览</button></div>
        <div class="row"><button class="m" data-m="Idle">Idle</button><button class="m" data-m="Tap">Tap</button><button class="m" data-m="Flick">Flick</button></div>
        <div class="row"><label>口型</label><input id="mouth" type="range" min="0" max="1.2" step="0.01" value="0" /></div>
        <div class="row"><label>视线X</label><input id="ex" type="range" min="-1" max="1" step="0.01" value="0" /></div>
        <div class="row"><label>视线Y</label><input id="ey" type="range" min="-1" max="1" step="0.01" value="0" /></div>
      </article>
    </section>
    <section class="card">
      <h2>事件流</h2>
      <pre id="events"></pre>
    </section>
    <section class="card">
      <h2>日志</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script type="module" src="./panel.js"></script>
</body>
</html>
